<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Usage · Rings</title>
<style>
  :root {
    --f: clamp(11px, 3.3vmin, 20px);
    --text: #eaf0ff; --dim: #8b97b8; --warn: #ffc857; --crit: #ff5d73;
    --codex: #4fd8c9; --claude: #ff9a6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; color: var(--text); -webkit-tap-highlight-color: transparent;
    background: radial-gradient(120% 90% at 15% 0%, #1a2350 0%, #0a0f1f 55%, #05070f 100%);
    font: var(--f)/1.3 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  #shift { height: 100%; display: grid; grid-template-rows: auto 1fr; gap: 1.2em; transition: transform 2s ease;
    padding: max(1em, env(safe-area-inset-top)) max(1.4em, env(safe-area-inset-right)) max(1em, env(safe-area-inset-bottom)) max(1.4em, env(safe-area-inset-left)); }

  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 1em; }
  #clock { font-size: clamp(48px, min(11vw, 20vh), 130px); font-weight: 200; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  #clock small { font-size: .28em; color: var(--dim); margin-left: .25em; letter-spacing: 0; font-weight: 300; }
  .right { text-align: right; padding-bottom: .3em; }
  #date { color: var(--dim); font-size: 1.15em; }
  #status { color: var(--crit); font-size: .8em; min-height: 1em; margin-top: .3em; }

  #tiles { display: grid; gap: .9em; min-height: 0; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); align-items: stretch; }
  @media (orientation: portrait) { #tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); align-content: start; } }
  .tile { --acc: var(--codex); display: flex; flex-direction: column; gap: .5em; min-height: 0; padding: .8em .9em;
    border-radius: 1.2em; background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 0 2.5em -1.2em var(--acc), inset 0 1px 0 rgba(255,255,255,.06); }
  .tile.claude { --acc: var(--claude); }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: .4em; }
  .top b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top span { color: var(--dim); font-size: .75em; white-space: nowrap; }
  .ringwrap { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; }
  .ringwrap svg { height: 100%; max-height: 100%; width: auto; max-width: 100%; aspect-ratio: 1; }
  .center { position: absolute; text-align: center; line-height: 1; }
  .center big { display: block; font-size: 2em; font-weight: 300; font-variant-numeric: tabular-nums; }
  .center small { color: var(--dim); font-size: .7em; }
  .legend { display: grid; gap: .15em; font-size: .82em; font-variant-numeric: tabular-nums; }
  .legend div { display: grid; grid-template-columns: .7em 2.4em 1fr auto; gap: .45em; align-items: center; }
  .legend i { width: .7em; height: .7em; border-radius: 50%; background: var(--c); }
  .legend .l { color: var(--dim); }
  .legend .p { text-align: right; font-weight: 600; }
  .legend .r { color: var(--dim); min-width: 3.4em; text-align: right; font-size: .9em; }
  .empty { color: var(--dim); grid-column: 1 / -1; text-align: center; align-self: center; }
</style>
</head>
<body>
<div id="shift">
  <header>
    <div id="clock">--:--</div>
    <div class="right"><div id="date"></div><div id="status"></div></div>
  </header>
  <main id="tiles"><div class="empty">Loading…</div></main>
</div>
<script src="/common.js"></script>
<script>
const { esc, left, untilReset, shortLabel, level } = Dash;
const R = [88, 68, 48], SW = 14;

function ring(p, accent) {
  const rings = p.windows.slice(0, 3).map((w, i) => {
    const pct = left(w), r = R[i], c = 2 * Math.PI * r, lv = level(pct);
    const col = lv === "crit" ? "var(--crit)" : lv === "warn" ? "var(--warn)" : accent;
    const op = [1, .72, .5][i];
    return `<circle cx="100" cy="100" r="${r}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="${SW}"/>
      <circle cx="100" cy="100" r="${r}" fill="none" stroke="${col}" stroke-opacity="${op}" stroke-width="${SW}" stroke-linecap="round"
        stroke-dasharray="${(c * pct) / 100} ${c}" transform="rotate(-90 100 100)"/>`;
  }).join("");
  return `<svg viewBox="0 0 200 200">${rings}</svg>`;
}

Dash.start({
  tick(n) {
    const h = n.getHours() % 12 || 12;
    document.getElementById("clock").innerHTML = `${h}:${Dash.pad(n.getMinutes())}<small>${n.getHours() < 12 ? "AM" : "PM"}</small>`;
    document.getElementById("date").textContent = n.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  },
  render({ providers, loaded, status }) {
    document.getElementById("status").textContent = status.text;
    const el = document.getElementById("tiles");
    if (!providers.length) { el.innerHTML = `<div class="empty">${loaded ? "No usage data" : "Loading…"}</div>`; return; }
    el.style.setProperty("--n", providers.length);
    el.innerHTML = providers.map((p) => {
      const accent = p.driver === "claudeAgent" ? "var(--claude)" : "var(--codex)";
      const first = p.windows[0];
      return `<section class="tile ${p.driver === "claudeAgent" ? "claude" : ""}">
        <div class="top"><b>${esc(p.name)}</b>${p.resetCredits ? `<span>${p.resetCredits} reset${p.resetCredits > 1 ? "s" : ""}</span>` : ""}</div>
        <div class="ringwrap">${ring(p, accent)}<div class="center"><big>${left(first)}%</big><small>${esc(shortLabel(first))} left</small></div></div>
        <div class="legend">${p.windows.slice(0, 3).map((w, i) => {
          const pct = left(w), lv = level(pct);
          const c = lv === "crit" ? "var(--crit)" : lv === "warn" ? "var(--warn)" : accent;
          return `<div style="--c:${c};opacity:${[1, .85, .7][i]}"><i></i><span class="l">${esc(shortLabel(w))}</span><span class="p">${pct}%</span><span class="r">${untilReset(w)}</span></div>`;
        }).join("")}</div></section>`;
    }).join("");
  },
});
</script>
</body>
</html>
